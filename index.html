<html lang="en">
<head>

<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles/app.css">
<script type="importmap">{

    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.min.js"
  },

    "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js": "sha384-9bdc/m98xZLhaPIxVG2gNC2aYWzhRmURsrQYkzArHqsLSVeeqWmrumq2FsPRnJEB",
    "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.min.js": "sha384-3j9YQEXY3lwfCB0T8j+4Y3dnA7/9TTX6SzmSRyT9wMgAxNYsftvmGtTZt1QQVmyH"
  }
}</script>
<script type="module" src="./main.js"></script>
</head>
<body>
<div id="app">
